<!DOCTYPE html>
<html lang="uz">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OsonGo — ovqat, ustalar, magazinlar va xizmatlar bitta ilovada.">
  <meta name="theme-color" content="#5B16E0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OsonGo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OsonGo — barchasi bir ilovada</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #3E0AB2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #FFFFFF;
    }
    .boot__logo {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: #7C3AED;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
    }
    .boot__title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .boot__caption {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
      background: #FFFFFF;
      color: #5B16E0;
      padding: 4px 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="boot">
    <img class="boot__logo" src="icons/Icon-192.png" alt="">
    <div class="boot__title">OsonGo</div>
    <div class="boot__caption">BARCHASI BIR ILOVADA</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
